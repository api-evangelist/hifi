code_scheme: >-
  Codes follow an SSCEE numbering pattern: the first two digits are the service
  id, the next digits the category, and the trailing digits the sequence within
  that category. Ranges: 10xxxx common, 20xxxx auth/authorization, 30xxxx user,
  40xxxx transaction, 50xxxx bank account, 60xxxx wallet, 70xxxx internal.
