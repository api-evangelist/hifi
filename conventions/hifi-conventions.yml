idempotency:
  supported: true
  mechanism: client-supplied request identifier
  field: requestId
  also: idempotencyKey (e.g. on the terms-of-service link resource)
  location: request body
  format: uuid (v4 recommended)
  retention: >-
    Reusing a requestId for an already-created resource returns the existing
    resource / a RESOURCE_CONFLICT (code 100005, "please try a different request
    id") rather than creating a duplicate transaction.
  evidence:
  - 38 request-body schemas in the OpenAPI expose a requestId field described as
    "Unique identifier for the request (recommend using uuid v4)".
  - RESOURCE_CONFLICT and TRANSACTION_REQUEST_ALREADY_EXISTS errors enforce
    idempotent transaction creation.
