    OfframpDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: amount of fiat currency to receive
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - usd
          - eur
          - brl
          - hkd
          - mxn
          - cop
          - ars
          - ngn
          - ugx
          - kes
          - zmw
          - mwk
          - rwf
          - tzs
          - xaf
          - xof
          - bwp
          - xaf
          - cdf
          - ghs
          - zar
          - inr
          description: fiat currency
        accountId:
          type: string
          format: uuid
          description: account that is receiving the fiat currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the fiat
        sameDayAch:
          type: boolean
          default: false
          description: same day ACH processing
        achReference:
          type: string
          description: 'a reference message to include when offramping through ACH transfer.


            it can be at most 10 characters, A-Z, a-z, 0-9, and spaces. Note that as of `2024-08-06`, setting this field is only supported for certain developers while we work on rolling out general support for everyone.

            '
        sepaReference:
          type: string
          description: 'a reference message to include when offramping through SEPA transfer.


            it must be between 6 to 140 characters. The allowed characters are a-z, A-Z, 0-9, spaces, ampersand (&), hyphen (-), full stop (.), and solidus (/).

            '
        wireMessage:
          type: string
          description: 'a message to include when offramping through WIRE transfer.


            it can be at most 4 lines, each with a max length of 35 char according to the Fedwire standard.

            '
        paymentReference:
          type: string
          description: 'a reference message to include when offramping.


            Please utilize `wireMessage` for wire transfer and `achReference` for ACH transfer instead of this field.

            '
        swiftReference:
          type: string
          description: 'A reference message to include when offramping through SWIFT transfer that is mainly use to indicate the purpose of payment.


            it can be at most 12 characters.

            '
      required:
      - currency
      - accountId
    Unauthorized:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    OfframpStatusEnum:
      type: string
      enum:
      - NOT_INITIATED
      - CREATED
      - OPEN_QUOTE
      - CRYPTO_INITIATED
      - AWAITING_FUNDS
      - CRYPTO_PENDING
      - CRYPTO_PROCESSED
      - FIAT_INITIATED
      - FIAT_PENDING
      - COMPLETED
      - FIAT_FAILED
      - FIAT_RETURNED
      - CRYPTO_RETURNED
      - CRYPTO_FAILED
      - QUOTE_FAILED
