          type: number
          format: float
          description: amount of fiat currency to receive
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - cop
          description: fiat currency
        accountId:
          type: string
          format: uuid
          description: account that is receiving the fiat currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the fiat
      required:
      - currency
      - accountId
    MxnOfframpDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: amount of fiat currency to receive
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - mxn
          description: fiat currency
        accountId:
          type: string
          format: uuid
          description: account that is receiving the fiat currency
        userId:
