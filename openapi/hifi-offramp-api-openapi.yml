openapi: 3.2.0
info:
  title: Hifi Offramp API
  version: 2.0.0
  description: API documentation for HIFI
servers:
- url: https://production.hifibridge.com
  description: Production server
- url: https://sandbox.hifibridge.com
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Offramp
  description: Offramp endpoints
paths:
  /v2/offramps:
    post:
      summary: Create an offramp
      description: 'An offramp facilitates the conversion of crypto to fiat. Once the crypto transfer is confirmed, HIFI will deposit the converted fiat into the receiving user’s bank account.


        There are two types of offramp:


        * **Quote-based offramp**: This type of offramp first returns the conversion rate quote based on the best market rate, which you can accept through the Accept an offramp quote endpoint to initiate the offramp.

        To learn more about quote-based offramps, click here.


        * **Non-quote-based offramp**: This type of offramp will be initiated immediately upon creating an offramp.'
      tags:
      - Offramp
      requestBody:
        $ref: '#/components/requestBodies/CreateOfframpBody'
      responses:
        '200':
          $ref: '#/components/responses/CryptoToFiatTransferResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2Offramps
      x-operation-id-source: derived
    get:
      summary: List all offramps
      description: Returns a list of offramps associated with a user under your organization. The offramps are returned sorted by creation date, with the most recent offramps appearing first.
      tags:
      - Offramp
      parameters:
      - $ref: '#/components/parameters/UserIdOptionalParameter'
      - $ref: '#/components/parameters/LimitParameter'
      - $ref: '#/components/parameters/CreatedBeforeParameter'
      - $ref: '#/components/parameters/CreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/CryptoToFiatAllRecordsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2Offramps
      x-operation-id-source: derived
  /v2/offramps/{transferId}:
    get:
      summary: Retrieve an offramp
      description: Retrieves an offramp.
      tags:
      - Offramp
      parameters:
      - $ref: '#/components/parameters/OfframpRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/CryptoToFiatRecordResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2OfframpsByTransferId
      x-operation-id-source: derived
  /v2/offramps/{transferId}/quote/accept:
    post:
      summary: Accept an offramp quote
      description: 'Accept and initiate a quote-based offramp.


        For example, an offramp from crypto currency `usdc` to fiat currency `brl` is quote-based so its initial status will be `OPEN_QUOTE`. After reviewing the offramp conversion rate quote information, you can accept it to initialize the offramp.'
      tags:
      - Offramp
      parameters:
      - $ref: '#/components/parameters/OfframpRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/CryptoToFiatAcceptQuoteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2OfframpsByTransferIdQuoteAccept
      x-operation-id-source: derived
  /v2/offramps/{transferId}/cancel:
    post:
      summary: Cancel an offramp
      description: Cancel an offramp that is in review. Only offramps with status `IN_REVIEW` can be cancelled.
      tags:
      - Offramp
      parameters:
      - $ref: '#/components/parameters/OfframpRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/CancelOfframpResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2OfframpsByTransferIdCancel
      x-operation-id-source: derived
  /v2/offramps/rates:
    get:
      summary: Retrieve an offramp rate
      description: Offramp rates are estimated rates for offramp conversions from different cryptocurrencies on different networks into all the different fiat currencies.
      tags:
      - Offramp
      parameters:
      - $ref: '#/components/parameters/FromCryptoCurrencyParameter'
      - $ref: '#/components/parameters/ToFiatCurrencyParameter'
      responses:
        '200':
          $ref: '#/components/responses/CryptoToFiatConversionRateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2OfframpsRates
      x-operation-id-source: derived
components:
  schemas:
    CreateHongKongGlobalNetworkOfframp:
      type: object
      title: Offramp Global Network (HKD)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - invoice_payments
          - payment_for_services
          - payment_for_software
          - payment_for_imported_goods
          - travel_services
          - transfer_to_own_account
          - repayment_of_loans
          - payroll
          - payment_of_property_rental
          - information_service_charges
          - advertising_and_public_relations
          - royalty_and_ip_fees
          - financial_service_fees
          - advisory_and_consulting_fees
          - representative_office_expenses
          - tax_payment
          - transportation_fees
          - construction_costs
          - insurance_premium
          - offline_goods_trade
          - insurance_claims
          - remittance_to_family_or_friends
          - education_expenses
          - medical_treatment
          - donations
          - mutual_fund_investment
          - currency_exchange
          - advance_payment_for_goods
          - merchant_settlement
          - repatriation_fund_settlement
        description:
          type: string
        source:
          type: object
          description: offramp source
          $ref: '#/components/schemas/OfframpSource'
        destination:
          type: object
          description: offramp destination
          $ref: '#/components/schemas/HongKongOfframpDestination'
        developerFee:
          description: custom offramp fees, omit if no fees are charged
          allOf:
          - $ref: '#/components/schemas/DeveloperFee'
        requireApproval:
          type: boolean
          description: 'Whether this offramp requires approval before processing.

            - `true`: Offramp will enter approval workflow

            - `false` or omitted: Offramp proceeds like usual

            '
          default: false
          example: false
        supportingInformation:
          $ref: '#/components/schemas/SupportingInformation'
        sandboxScenario:
          $ref: '#/components/schemas/SandboxScenario'
      required:
      - requestId
      - source
      - destination
    DeveloperFee:
      type: object
      properties:
        fees:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - PERCENTAGE
                - FLAT
              value:
                type: string
                description: 'Fee amount as a string. For PERCENTAGE type, "0.0005" represents 0.05%.

                  For FLAT type, represents absolute amount.

                  For PERCENTAGE type, the value must be between 0 and 1 with max 4 decimal places.

                  '
              walletAddress:
                type: string
                description: Wallet address to receive the fee
            required:
            - type
            - value
            - walletAddress
      required:
      - fees
    NigeriaOfframpDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: amount of fiat currency to receive
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - ngn
          description: fiat currency
        accountId:
          type: string
          format: uuid
          description: account that is receiving the fiat currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the fiat
        paymentReference:
          type: string
          description: 'a reference message to include when offramping.

            '
      required:
      - currency
      - accountId
    OfframpAllRecordsObject:
      type: object
      properties:
        count:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/OfframpRecordObject'
        nextCursor:
          type: string
          description: The `createdAt` timestamp of the last record in the current page. Pass this as `createdBefore` in the next request to retrieve the next page of results.
    SandboxScenario:
      type: string
      enum:
      - FIAT_FAILED
      - CRYPTO_FAILED
      - COMPLETED
      description: 'Sandbox-only field that forces this offramp to a predetermined outcome

        '
    BrlOfframpDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: amount of fiat currency to receive
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - brl
          description: fiat currency
        accountId:
          type: string
          format: uuid
          description: account that is receiving the fiat currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the fiat
        paymentReference:
          type: string
          description: 'a reference message to include when offramping.

            '
      required:
      - userId
      - currency
      - accountId
    OfframpDepositInstructionsList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          fromAddress:
            type: string
          toAddress:
            type: string
          currency:
            type: string
          contractAddress:
            type: string
          rawAmount:
            type: string
          amount:
            type: number
          chain:
            type: string
          collected:
            type: boolean
          collectable:
            type: boolean
          expiresAt:
            type: string
            format: date-time
          transactionHash:
            type:
            - string
            - 'null'
    UsdOfframpDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: amount of fiat currency to receive
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - usd
          description: fiat currency
        accountId:
          type: string
          format: uuid
          description: account that is receiving the fiat currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the fiat
        sameDayAch:
          type: boolean
          default: false
          description: same day ACH processing
        achReference:
          type: string
          description: 'a reference message to include when offramping through ACH transfer.


            it can be at most 10 characters, A-Z, a-z, 0-9, and spaces. Note that as of `2024-08-06`, setting this field is only supported for certain developers while we work on rolling out general support for everyone.

            '
        wireMessage:
          type: string
          description: 'a message to include when offramping through WIRE transfer.


            it can be at most 4 lines, each with a max length of 35 char according to the Fedwire standard.

            '
        swiftReference:
          type: string
          description: 'A reference message to include when offramping through SWIFT transfer that is mainly use to indicate the purpose of payment.


            it can be at most 12 characters.

            '
      required:
      - currency
      - accountId
    SupportingInformationDocument:
      type: object
      description: A supporting document for the offramp (e.g. invoice, contract).
      properties:
        fileId:
          type: string
          format: uuid
          description: Public file ID of an uploaded file.
        type:
          type: string
          enum:
          - INVOICE
          - CONTRACT
          - AGREEMENT
          - PURCHASE_ORDER
          - OTHER
          description: Type of supporting document.
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Optional description of the document.
      required:
      - fileId
      - type
    CreateBrazilGlobalNetworkOfframp:
      type: object
      title: Offramp Global Network (BRL)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - invoice_payments
          - payment_for_services
          - payment_for_software
          - payment_for_imported_goods
          - travel_services
          - transfer_to_own_account
          - repayment_of_loans
          - payroll
          - payment_of_property_rental
          - information_service_charges
          - advertising_and_public_relations
          - royalty_and_ip_fees
          - financial_service_fees
          - advisory_and_consulting_fees
          - representative_office_expenses
          - tax_payment
          - transportation_fees
          - construction_costs
          - insurance_premium
          - offline_goods_trade
          - insurance_claims
          - remittance_to_family_or_friends
          - education_expenses
          - medical_treatment
          - donations
          - mutual_fund_investment
          - currency_exchange
          - advance_payment_for_goods
          - merchant_settlement
          - repatriation_fund_settlement
        description:
          type: string
        source:
          type: object
          description: offramp source
          $ref: '#/components/schemas/OfframpSource'
        destination:
          type: object
          description: offramp destination
          $ref: '#/components/schemas/BrlOfframpDestination'
        developerFee:
          description: custom offramp fees, omit if no fees are charged
          allOf:
          - $ref: '#/components/schemas/DeveloperFee'
        requireApproval:
          type: boolean
          description: 'Whether this offramp requires approval before processing.

            - `true`: Offramp will enter approval workflow

            - `false` or omitted: Offramp proceeds like usual

            '
          default: false
          example: false
        supportingInformation:
          $ref: '#/components/schemas/SupportingInformation'
        sandboxScenario:
          $ref: '#/components/schemas/SandboxScenario'
      required:
      - requestId
      - source
      - destination
    CreateMexicoGlobalNetworkOfframp:
      type: object
      title: Offramp Global Network (MXN)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - invoice_payments
          - payment_for_services
          - payment_for_software
          - payment_for_imported_goods
          - travel_services
          - transfer_to_own_account
          - repayment_of_loans
          - payroll
          - payment_of_property_rental
          - information_service_charges
          - advertising_and_public_relations
          - royalty_and_ip_fees
          - financial_service_fees
          - advisory_and_consulting_fees
          - representative_office_expenses
          - tax_payment
          - transportation_fees
          - construction_costs
          - insurance_premium
          - offline_goods_trade
          - insurance_claims
          - remittance_to_family_or_friends
          - education_expenses
          - medical_treatment
          - donations
          - mutual_fund_investment
          - currency_exchange
          - advance_payment_for_goods
          - merchant_settlement
          - repatriation_fund_settlement
        description:
          type: string
        source:
          type: object
          description: offramp source
          $ref: '#/components/schemas/OfframpSource'
        destination:
          type: object
          description: offramp destination
          $ref: '#/components/schemas/MxnOfframpDestination'
        developerFee:
          description: custom offramp fees, omit if no fees are charged
          allOf:
          - $ref: '#/components/schemas/DeveloperFee'
        requireApproval:
          type: boolean
          description: 'Whether this offramp requires approval before processing.

            - `true`: Offramp will enter approval workflow

            - `false` or omitted: Offramp proceeds like usual

            '
          default: false
          example: false
        supportingInformation:
          $ref: '#/components/schemas/SupportingInformation'
        sandboxScenario:
          $ref: '#/components/schemas/SandboxScenario'
      required:
      - requestId
      - source
      - destination
    SupportingInformation:
      type: object
      description: 'Optional supporting information for the offramp. May include detailed purpose of payment,

        beneficiary details, and supporting documents. When provided, documents must reference

        files previously uploaded via the file upload API.

        '
      properties:
        detailedPurposeOfPayment:
          type: string
          minLength: 1
          maxLength: 500
          description: Detailed description of the purpose of the payment.
        beneficiaryDetails:
          $ref: '#/components/schemas/SupportingInformationBeneficiaryDetails'
        documents:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/SupportingInformationDocument'
          description: Supporting documents (e.g. invoice, contract). Each document must reference an uploaded file by fileId.
    CreateUsdOfframp:
      type: object
      title: Offramp (USD)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
          description: 'Refer to [here](https://docs.hifi.com/transactions/offramps#purpose-of-payment-code) for more details on the purpose of payment code to provide.

            '
        supportingDocumentType:
          type: string
          enum:
          - billing_document
          - order_document
          - shipment_document
          - regulatory_document
          - transport_document
          - other_document
          description: 'The type of supporting document, required for swift payment.

            '
        supportingDocumentUrl:
          type: string
          description: 'The URL of the supporting document, required for swift payment.

            '
        description:
          type: string
        source:
          type: object
          description: offramp source
          $ref: '#/components/schemas/OfframpSource'
        destination:
          type: object
          description: offramp destination
          $ref: '#/components/schemas/UsdOfframpDestination'
        developerFee:
          type:
          - object
          - 'null'
          description: custom offramp developer fee, omit if no developer fee is charged
          $ref: '#/components/schemas/DeveloperFee'
        requireApproval:
          type: boolean
          description: 'Whether this offramp requires approval before processing.

            - `true`: Offramp will enter approval workflow

            - `false` or omitted: Offramp proceeds like usual

            '
          default: false
          example: false
        supportingInformation:
          $ref: '#/components/schemas/SupportingInformation'
        sandboxScenario:
          $ref: '#/components/schemas/SandboxScenario'
      required:
      - requestId
      - source
      - destination
