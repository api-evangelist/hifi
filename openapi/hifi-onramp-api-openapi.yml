openapi: 3.2.0
info:
  title: Hifi Onramp API
  version: 2.0.0
  description: API documentation for HIFI
servers:
- url: https://production.hifibridge.com
  description: Production server
- url: https://sandbox.hifibridge.com
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Onramp
  description: Onramp endpoints
paths:
  /v2/onramps:
    post:
      summary: Create an onramp
      description: 'An onramp facilitates the conversion of fiat to crypto. Once the fiat payment is received, HIFI will deliver the converted crypto to the receiving user’s wallet.


        There are two types of onramp:


        * **Quote-based onramp**: This type of onramp first returns the conversion rate quote based on the best market rate, which you can accept through the Accept an onramp quote endpoint to initiate the onramp.

        Additionally, you can also refresh the onramp quote using the Refresh an onramp quote endpoint to refresh the conversion rate associated with the onramp. To learn more about quote-based onramps, click here.


        * **Non-quote-based onramp**: This type of onramp will be initiated immediately upon creating an onramp.'
      tags:
      - Onramp
      requestBody:
        $ref: '#/components/requestBodies/CreateOnrampBody'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoTransferResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2Onramps
      x-operation-id-source: derived
    get:
      summary: List all onramps
      description: Returns a list of onramps associated with a user under your organization. The onramps are returned sorted by creation date, with the most recent onramps appearing first.
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/UserIdOptionalParameter'
      - $ref: '#/components/parameters/LimitParameter'
      - $ref: '#/components/parameters/CreatedBeforeParameter'
      - $ref: '#/components/parameters/CreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoAllRecordsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2Onramps
      x-operation-id-source: derived
  /v2/onramps/{transferId}:
    get:
      summary: Retrieve an onramp
      description: Retrieves an onramp.
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoRecordResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2OnrampsByTransferId
      x-operation-id-source: derived
  /v2/onramps/{transferId}/quote/accept:
    post:
      summary: Accept an onramp quote
      description: 'Accept a quote-based onramp.


        For example, an onramp from fiat currency `brl` to crypto currency `usdc` is quote-based so its initial status will be `OPEN_QUOTE`. After reviewing the onramp conversion rate quote information, you can accept it to initialize the onramp.'
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoAcceptQuoteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2OnrampsByTransferIdQuoteAccept
      x-operation-id-source: derived
  /v2/onramps/{transferId}/quote/refresh:
    post:
      summary: Refresh an onramp quote
      description: Refresh the conversion rate quote that is associated with a quote-based onramp. You can only refresh an onramp quote with the status `OPEN_QUOTE`.
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoRefreshQuoteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2OnrampsByTransferIdQuoteRefresh
      x-operation-id-source: derived
  /v2/onramps/{transferId}/cancel:
    post:
      summary: Cancel an onramp
      description: Cancel an onramp that is in review. Only onramps with status `IN_REVIEW` can be cancelled.
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/CancelOnrampResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2OnrampsByTransferIdCancel
      x-operation-id-source: derived
  /v2/onramps/rates:
    get:
      summary: Retrieve an onramp rate
      description: Onramp rates are estimated rates for onramp conversions from different fiat currencies into different cryptocurrencies.
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/FromFiatCurrencyParameter'
      - $ref: '#/components/parameters/ToCryptoCurrencyParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoConversionRateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2OnrampsRates
      x-operation-id-source: derived
components:
  parameters:
    ToCryptoCurrencyParameter:
      name: toCurrency
      in: query
      schema:
        type: string
        enum:
        - usdc
      required: true
    CreatedAfterParameter:
      name: createdAfter
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    CreatedBeforeParameter:
      name: createdBefore
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    UserIdOptionalParameter:
      name: userId
      in: query
      schema:
        type: string
      description: The user ID.
      required: false
    FromFiatCurrencyParameter:
      name: fromCurrency
      in: query
      schema:
        type: string
        enum:
        - usd
        - ugx
        - ngn
        - bwp
        - tzs
        - mwk
        - xaf
        - kes
      required: true
    LimitParameter:
      name: limit
      in: query
      schema:
        type: string
        minimum: 1
        maximum: 100
      description: default to 10, maximum to 100
      required: false
    OnrampRecordIDPathParameter:
      name: transferId
      in: path
      schema:
        type: string
      description: Transfer record ID.
      required: true
  schemas:
    CreateBrlOnramp:
      type: object
      title: Onramp (BRL)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/BrlOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type:
          - object
          - 'null'
          description: custom onramp fee, omit if no fee is charged
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    CreateMxnOnramp:
      type: object
      title: Onramp (MXN)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/MxnOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type:
          - object
          - 'null'
          description: custom onramp fee, omit if no fee is charged
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    CreateAfricaOnramp:
      type: object
      title: Onramp (Africa)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/AfricaOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type:
          - object
          - 'null'
          description: custom onramp fee, omit if no fee is charged
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
      - purposeOfPayment
    MxnOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - mxn
          description: fiat currency
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
    UsdOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - usd
          description: fiat currency
        transferType:
          type: string
          enum:
          - ach
          - wire
          description: 'payment network type

            '
        accountId:
          type: string
          format: uuid
          description: 'bank account to ACH pull from.

            '
        userId:
          type: string
          format: uuid
          description: user who is funding the fiat.
      required:
      - transferType
      - currency
      - userId
    OnrampDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of crypto currency to receive
        currency:
          type: string
          enum:
          - usdc
          - usdt
          - usdHifi
          description: 'crypto currency (note: `usdHifi` is only available in sandbox to simulate token movement)

            '
        chain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - BASE
          - TRON
          description: chain of the crypto currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the crypto, required if `externalWalletId` is not provided
        externalWalletId:
          type: string
          format: uuid
          description: external wallet id who is receiving the crypto, required if `userId` is not provided
    Unauthorized:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    OnrampObject:
      type: object
      properties:
        transferType:
          type: string
        transferDetails:
          type: object
          properties:
            id:
              type: string
              format: uuid
            requestId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            status:
              $ref: '#/components/schemas/OnrampStatusEnum'
            failedReason:
              type:
              - string
              - 'null'
              description: Legacy failure label. `null` unless the transaction failed, and `null` on most failures in favour of `error` / `errorDetails`.
            error:
              type: string
              description: 'Error code when the onramp transaction has failed (e.g. `INTERNAL_ERROR`, `EXPIRED`, `AMOUNT_TOO_LOW`, `TRANSACTION_REJECTED`).

                Present when status is a failed state such as `FIAT_FAILED`, `CRYPTO_FAILED`, or `QUOTE_FAILED`.

                '
            errorDetails:
              type: string
              description: 'Human-readable error details when the onramp transaction has failed.

                Present when status is a failed state.

                '
            source:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                currency:
                  type: string
                amount:
                  type: number
                  format: float
                accountId:
                  type:
                  - string
                  - 'null'
                  description: Source account the fiat was pulled from. `null` for deposits into a virtual account or into onramp deposit instructions, where no source account is on file.
                user:
                  type: object
                  properties:
                    email:
                      type:
                      - string
                      - 'null'
                    lastName:
                      type:
                      - string
                      - 'null'
                      description: '`null` for business users, which carry `businessName` instead.'
                    firstName:
                      type:
                      - string
                      - 'null'
                      description: '`null` for business users, which carry `businessName` instead.'
                    businessName:
                      type:
                      - string
                      - 'null'
                      description: '`null` for individual users, which carry `firstName` / `lastName` instead.'
                bankInfo:
                  allOf:
                  - $ref: '#/components/schemas/InboundObject'
            destination:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                currency:
                  type: string
                chain:
                  type: string
                walletAddress:
                  type: string
                externalWalletId:
                  type: string
                amount:
                  type: number
                  format: float
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    lastName:
                      type: string
                    firstName:
                      type: string
                    businessName:
                      type: string
            receipt:
              type: object
              properties:
                transactionHash:
                  type:
                  - string
                  - 'null'
                returnReasonCode:
                  type:
                  - string
                  - 'null'
                  description: Reason code for the returned inbound payment. Only populated when `status` is `FIAT_RETURNED`.
            virtualAccountId:
              type:
              - string
              - 'null'
              format: uuid
              description: Virtual account the funds were deposited into. `null` when the onramp was not driven by a virtual account.
            microDeposits:
              type: object
              description: Micro deposits received into the onramp deposit account while it is awaiting funds.
              properties:
                count:
                  type: integer
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      createdAt:
                        type: string
                        format: date-time
                      currency:
                        type: string
                      amount:
                        type: string
                        description: Amount received, in dollars as a decimal string (for example `"0.71"`). Not cents.
                        example: '0.71'
                      sourceBankInfo:
                        $ref: '#/components/schemas/InboundObject'
            quoteInformation:
              type:
              - object
              - 'null'
              properties:
                sendGross:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                sendNet:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                railFee:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                receiveGross:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                receiveNet:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                rate:
                  type: string
                conversionFee:
                  type: object
                  description: Conversion fee applied on the quote. Present on usd onramps, where it is always zero.
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                    description:
                      type: string
                    timing:
                      type: string
                expiresAt:
                  type: string
                  description: 'Expiry of the quote as an ISO 8601 timestamp. Returns the literal string `"N/A"` for

                    static quotes (usd onramps), which do not expire.

                    '
            depositInfo:
              allOf:
              - $ref: '#/components/schemas/OnrampDepositInfoObject'
    OnrampQuoteObject:
      $ref: '#/components/schemas/OnrampObject'
    InboundObject:
      type: object
      properties:
        bankName:
          type:
          - string
          - 'null'
        senderName:
          type:
          - string
          - 'null'
        routingNumber:
          type:
          - string
          - 'null'
        accountNumber:
          type:
          - string
          - 'null'
        accountType:
          type:
          - string
          - 'null'
          description: ACH field. `null` when the inbound payment did not carry it.
        fedBatchId:
          type:
          - string
          - 'null'
          description: ACH field. `null` when the inbound payment did not carry it.
        imad:
          type:
          - string
          - 'null'
          description: Fedwire input message identifier. `null` when the inbound payment did not carry it.
        omad:
          type:
          - string
          - 'null'
          description: Fedwire output message identifier. `null` when the inbound payment did not carry it.
        traceNumber:
          type:
          - string
          - 'null'
          description: Trace number for the inbound payment. `null` when the payment did not carry one.
        bankAddress:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        references:
          type:
          - object
          - 'null'
          description: Remittance and reference information supplied by the sender. `null` when the payment carried none.
          properties:
            senderReference:
              type:
              - string
              - 'null'
            beneficiaryReference:
              type:
              - string
              - 'null'
            remittance:
              type: array
              items:
                type: string
        paymentRail:
          type:
          - string
          - 'null'
          enum:
          - ach
          - wire
          - rtp
    CreateUsdOnramp:
      type: object
      title: Onramp (USD)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/UsdOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type: object
          description: custom onramp fee, omit if no fee is charged
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    InternalServerError:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    BrlOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - brl
          description: fiat currency
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
    CreateOnramp:
      type: object
      title: Onramp
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/OnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type:
          - object
          - 'null'
          description: custom onramp fee, omit if no fee is charged
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    OnrampRecordObject:
      $ref: '#/components/schemas/OnrampObject'
    OnrampDepositInfoObject:
      type: object
      properties:
        bankName:
          type: string
        bankAddress:
          type: string
        swiftCode:
          type: string
        beneficiary:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
        ach:
          type: object
          properties:
            routingNumber:
              type: string
            accountNumber:
              type: string
        wire:
          type: object
          properties:
            routingNumber:
              type: string
            accountNumber:
              type: string
        rtp:
          type: object
          properties:
            routingNumber:
              type: string
            accountNumber:
              type: string
        reference:
          type: string
        depositBy:
          type: string
          format: date-time
        instruction:
          type: string
    OnrampFee:
      type: object
      properties:
        type:
          type: string
          enum:
          - FIX
          - PERCENT
        value:
          type: number
          format: float
          minimum: 0
          description: 'custom transaction fee (`0.01` represents `1%` when `type` is set to `PERCENT`, checkout https://docs.hifi.com/v2/docs/fee-collection for more information)

            '
      required:
      - type
      - value
    OnrampAcceptedQuoteObject:
      type: object
      allOf:
      - $ref: '#/components/schemas/OnrampObject'
      - type: object
        properties:
          depositInfo:
            $ref: '#/components/schemas/OnrampDepositInfoObject'
    AfricaOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          description: 'fiat currency.

            Look at the list of supported `currency` [here](https://docs.google.com/spreadsheets/d/1QxAWGoZMznB6_Ts4mzFcFD49ZOMUZNdNiR6wlr8NDL0/edit?gid=293141391#gid=293141391).

            Make sure the `currency` enum is supported for the provided `accountId`.

            '
        accountId:
          type: string
          format: uuid
          description: 'account the fiat comes from. eg. usd Plaid account


            * this field is optional when onramping from `currency`: `usd`

            * this field is not required when onramping from `currency`: `brl`

            * this field is required when onramping from the rest of the currencies

            '
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
      - accountId
    OnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - usd
          - ngn
          - mwk
          - bwp
          - xaf
          - ghs
          - kes
          - rwf
          - zar
          - tzs
          - ugx
          - xof
          - zmw
          - brl
          - mxn
          - eur
          description: fiat currency
        transferType:
          type: string
          enum:
          - ach
          - wire
          description: 'payment network type


            * this field is used when onramping from usd, default is `ach`

            '
        accountId:
          type: string
          format: uuid
          description: 'account the fiat comes from. eg. usd Plaid account


            * this field is optional when onramping from `currency`: `usd`

            * this field is not required when onramping from `currency`: `brl`, `mxn`

            * this field is required when onramping from the rest of the currencies

            '
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
    OnrampStatusEnum:
      type: string
      enum:
      - NOT_INITIATED
      - CREATED
      - OPEN_QUOTE
      - IN_REVIEW
      - FIAT_INITIATED
      - AWAITING_FUNDS
      - FIAT_PENDING
      - FIAT_PROCESSED
      - CRYPTO_INITIATED
      - CRYPTO_PENDING
      - COMPLETED
      - FIAT_FAILED
      - FIAT_RETURNED
      - CRYPTO_FAILED
      - QUOTE_FAILED
      - EXPIRED
      - CANCELLED
      - UNKNOWN
      description: 'Refer to [here](https://docs.hifi.com/docs/transfers/onramps#transaction-status) for more details on each onramp status.

        '
