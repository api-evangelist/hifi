                firstName: Henry
                businessName: null
            receipt:
              transactionHash: null
            developerFee: null
            virtualAccountId: null
            quoteInformation:
              sendGross:
                amount: '10.00'
                currency: usd
              sendNet:
                amount: '10.00'
