openapi: 3.0.0
info:
  title: Hifi Account Onramp API
  version: 2.0.0
  description: API documentation for Hifi
servers:
- url: https://production.hifibridge.com
  description: Production server
- url: https://sandbox.hifibridge.com
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Onramp
  description: Onramp endpoints
paths:
  /v2/onramps:
    post:
      summary: Create an onramp
      description: "\nAn onramp facilitates the conversion of fiat to crypto. Once the fiat payment is received, HIFI will deliver the converted crypto to the receiving user’s wallet.\n\nThere are two types of onramp:\n\n* **Quote-based onramp**: This type of onramp first returns the conversion rate quote based on the best market rate, which you can accept through the [Accept an onramp quote](https://docs.hifibridge.com/api-reference/onramp/accept-an-onramp-quote) endpoint to initiate the onramp.  \n  Additionally, you can also refresh the onramp quote using the [Refresh an onramp quote](https://docs.hifibridge.com/api-reference/onramp/refresh-an-onramp-quote) endpoint to refresh the conversion rate associated with the onramp. To learn more about quote-based onramps, click [here](https://docs.hifibridge.com/guides/transfers/onramps/usd-usdc).\n\n* **Non-quote-based onramp**: This type of onramp will be initiated immediately upon creating an onramp.\n"
      tags:
      - Onramp
      requestBody:
        $ref: '#/components/requestBodies/CreateOnrampBody'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoTransferResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    get:
      summary: List all onramps
      description: 'Returns a list of onramps associated with a user under your organization. The onramps are returned sorted by creation date, with the most recent onramps appearing first.

        '
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/UserIdOptionalParameter'
      - $ref: '#/components/parameters/LimitParameter'
      - $ref: '#/components/parameters/CreatedBeforeParameter'
      - $ref: '#/components/parameters/CreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoAllRecordsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/onramps/{transferId}:
    get:
      summary: Retrieve an onramp
      description: Retrieves an onramp.
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoRecordResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/onramps/{transferId}/quote/accept:
    post:
      summary: Accept an onramp quote
      description: 'Accept a quote-based onramp.


        For example, an onramp from fiat currency `brl` to crypto currency `usdc` is quote-based so its initial status will be `OPEN_QUOTE`. After reviewing the onramp conversion rate quote information, you can accept it to initialize the onramp.

        '
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoAcceptQuoteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/onramps/{transferId}/quote/refresh:
    post:
      summary: Refresh an onramp quote
      description: 'Refresh the conversion rate quote that is associated with a quote-based onramp. You can only refresh an onramp quote with the status `OPEN_QUOTE`.

        '
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/OnrampRecordIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoRefreshQuoteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/onramps/rates:
    get:
      summary: Retrieve an onramp rate
      description: 'Onramp rates are estimated rates for onramp conversions from different fiat currencies into different cryptocurrencies.

        '
      tags:
      - Onramp
      parameters:
      - $ref: '#/components/parameters/FromFiatCurrencyParameter'
      - $ref: '#/components/parameters/ToCryptoCurrencyParameter'
      responses:
        '200':
          $ref: '#/components/responses/FiatToCryptoConversionRateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
components:
  schemas:
    CreateBrlOnramp:
      type: object
      title: Onramp (BRL)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/BrlOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type: object
          description: custom onramp fee, omit if no fee is charged
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    OnrampAcceptedQuoteObject:
      type: object
      allOf:
      - $ref: '#/components/schemas/OnrampObject'
      - type: object
        properties:
          depositInfo:
            $ref: '#/components/schemas/OnrampDepositInfoObject'
    MxnOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - mxn
          description: fiat currency
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
    AfricaOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          description: 'fiat currency.

            Look at the list of supported `currency` [here](https://docs.google.com/spreadsheets/d/1QxAWGoZMznB6_Ts4mzFcFD49ZOMUZNdNiR6wlr8NDL0/edit?gid=293141391#gid=293141391).

            Make sure the `currency` enum is supported for the provided `accountId`.

            '
        accountId:
          type: string
          format: uuid
          description: 'account the fiat comes from. eg. usd Plaid account


            * this field is optional when onramping from `currency`: `usd`

            * this field is not required when onramping from `currency`: `brl`

            * this field is required when onramping from the rest of the currencies

            '
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
      - accountId
    OnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - usd
          - ngn
          - mwk
          - bwp
          - xaf
          - ghs
          - kes
          - rwf
          - zar
          - tzs
          - ugx
          - xof
          - zmw
          - brl
          - mxn
          - eur
          description: fiat currency
        transferType:
          type: string
          enum:
          - ach
          - wire
          description: 'payment network type


            * this field is used when onramping from usd, default is `ach`

            '
        accountId:
          type: string
          format: uuid
          description: 'account the fiat comes from. eg. usd Plaid account


            * this field is optional when onramping from `currency`: `usd`

            * this field is not required when onramping from `currency`: `brl`, `mxn`

            * this field is required when onramping from the rest of the currencies

            '
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
    OnrampDestination:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of crypto currency to receive
        currency:
          type: string
          enum:
          - usdc
          - usdt
          - usdHifi
          description: 'crypto currency (note: `usdHifi` is only available in sandbox to simulate token movement)

            '
        chain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - BASE
          description: chain of the crypto currency
        userId:
          type: string
          format: uuid
          description: user who is receiving the crypto, required if `externalWalletId` is not provided
        externalWalletId:
          type: string
          format: uuid
          description: external wallet id who is receiving the crypto, required if `userId` is not provided
    OnrampQuoteObject:
      $ref: '#/components/schemas/OnrampObject'
    BrlOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - brl
          description: fiat currency
        userId:
          type: string
          format: uuid
          description: user who is sending the fiat
      required:
      - currency
      - userId
    OnrampAllRecordsObject:
      type: object
      properties:
        count:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/OnrampRecordObject'
        nextCursor:
          type: string
          description: The `createdAt` timestamp of the last record in the current page. Pass this as `createdBefore` in the next request to retrieve the next page of results.
    CreateUsdOnramp:
      type: object
      title: Onramp (USD)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/UsdOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type: object
          description: custom onramp fee, omit if no fee is charged
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    InternalServerError:
      type: object
      properties:
        error:
          type: string
          example: Unexpected error happened
    OnrampStatusEnum:
      type: string
      enum:
      - NOT_INITIATED
      - CREATED
      - OPEN_QUOTE
      - FIAT_INITIATED
      - AWAITING_FUNDS
      - FIAT_PENDING
      - FIAT_PROCESSED
      - CRYPTO_INITIATED
      - CRYPTO_PENDING
      - COMPLETED
      - FIAT_FAILED
      - FIAT_RETURNED
      - CRYPTO_FAILED
      - QUOTE_FAILED
      - EXPIRED
      - UNKNOWN
      description: 'Refer to [here](https://docs.hifibridge.com/docs/transfers/onramps#transaction-status) for more details on each onramp status.

        '
    OnrampRecordObject:
      $ref: '#/components/schemas/OnrampObject'
    OnrampObject:
      type: object
      properties:
        transferType:
          type: string
        transferDetails:
          type: object
          properties:
            id:
              type: string
              format: uuid
            requestId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            status:
              $ref: '#/components/schemas/OnrampStatusEnum'
            failedReason:
              type: string
            source:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                currency:
                  type: string
                amount:
                  type: number
                  format: float
                accountId:
                  type: string
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    lastName:
                      type: string
                    firstName:
                      type: string
                    businessName:
                      type: string
                bankInfo:
                  $ref: '#/components/schemas/InboundObject'
            destination:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                currency:
                  type: string
                chain:
                  type: string
                walletAddress:
                  type: string
                externalWalletId:
                  type: string
                amount:
                  type: number
                  format: float
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    lastName:
                      type: string
                    firstName:
                      type: string
                    businessName:
                      type: string
            receipt:
              type: object
              properties:
                transactionHash:
                  type: string
            developerFee:
              type: object
            quoteInformation:
              type: object
              properties:
                sendGross:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                sendNet:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                railFee:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                receiveGross:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                receiveNet:
                  type: object
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                rate:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
            depositInfo:
              $ref: '#/components/schemas/OnrampDepositInfoObject'
    FiatToCryptoConversionRateObject:
      type: object
      properties:
        fromCurrency:
          type: string
          enum:
          - usd
          - ugx
          - ngn
          - bwp
          - tzs
          - mwk
          - xaf
          - kes
          description: source currency
        toCurrency:
          type: string
          enum:
          - usdc
          description: target currency
        conversionRate:
          type: string
        conversionRates:
          type: array
          items:
            type: object
            properties:
              transferType:
                type: string
                description: when `transferType` is `default`, this is the conversion rate for the default transfer type
              conversionRate:
                type: string
      example:
        fromCurrency: usd
        toCurrency: usdc
        conversionRate: '1'
        conversionRates:
        - transferType: default
          conversionRate: '1'
    OnrampFee:
      type: object
      properties:
        type:
          type: string
          enum:
          - FIX
          - PERCENT
        value:
          type: number
          format: float
          minimum: 0
          description: 'custom transaction fee (`0.01` represents `1%` when `type` is set to `PERCENT`, checkout https://docs.hifibridge.com/v2/docs/fee-collection for more information)

            '
      required:
      - type
      - value
    OnrampDepositInfoObject:
      type: object
      properties:
        bankName:
          type: string
        bankAddress:
          type: string
        swiftCode:
          type: string
        beneficiary:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
        ach:
          type: object
          properties:
            routingNumber:
              type: string
            accountNumber:
              type: string
        wire:
          type: object
          properties:
            routingNumber:
              type: string
            accountNumber:
              type: string
        rtp:
          type: object
          properties:
            routingNumber:
              type: string
            accountNumber:
              type: string
        reference:
          type: string
        depositBy:
          type: string
          format: date-time
        instruction:
          type: string
    InboundObject:
      type: object
      properties:
        bankName:
          type: string
        senderName:
          type: string
        routingNumber:
          type: string
        accountNumber:
          type: string
        accountType:
          type: string
        fedBatchId:
          type: string
        imad:
          type: string
        omad:
          type: string
        traceNumber:
          type: string
        bankAddress:
          type: string
        description:
          type: string
        paymentRail:
          type: string
          enum:
          - ach
          - wire
          - rtp
    CreateAfricaOnramp:
      type: object
      title: Onramp (Africa)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/AfricaOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type: object
          description: custom onramp fee, omit if no fee is charged
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
      - purposeOfPayment
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          example: Not authorized
    CreateOnramp:
      type: object
      title: Onramp
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/OnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type: object
          description: custom onramp fee, omit if no fee is charged
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    CreateMxnOnramp:
      type: object
      title: Onramp (MXN)
      properties:
        requestId:
          type: string
          description: unique identifier for the request (recommend using uuid v4)
        purposeOfPayment:
          type: string
          enum:
          - gift
          - bills
          - groceries
          - travel
          - health
          - entertainment
          - housing
          - school-fees
          - other
        isInstant:
          type: boolean
          default: false
          description: 'instant onramp. coming soon ...

            '
        source:
          type: object
          description: onramp source
          $ref: '#/components/schemas/MxnOnrampSource'
        destination:
          type: object
          description: onramp destination
          $ref: '#/components/schemas/OnrampDestination'
        fee:
          type: object
          description: custom onramp fee, omit if no fee is charged
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OnrampFee'
      required:
      - requestId
      - source
      - destination
    UsdOnrampSource:
      type: object
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          description: amount of fiat currency to send
        currency:
          type: string
          enum:
          - usd
          description: fiat currency
        transferType:
          type: string
          enum:
          - ach
          - wire
          description: 'payment network type

            '
        accountId:
          type: string
          format: uuid
          description: 'bank account to ACH pull from.

            '
        userId:
          type: string
          format: uuid
          description: user who is funding the fiat.
      required:
      - transferType
      - currency
      - userId
  examples:
    OnrampObjectListExample:
      summary: Onramp Object List
      value:
        count: 1
        records:
        - transferType: ONRAMP
          transferDetails:
            id: b26927e6-2771-423c-af44-a3c7a3e815c5
            requestId: e1047def-6942-4fd7-be04-e62eb41813b6
            createdAt: '2025-02-03T17:15:31.927121+00:00'
