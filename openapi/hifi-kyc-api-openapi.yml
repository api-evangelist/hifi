    USDRailBusinessKYCReqOptObject:
      type: object
      title: KYC Requirement Object (USD - Business)
      properties:
        userId:
          type: string
          format: uuid
        rails:
          $ref: '#/components/schemas/RailsEnum'
        type:
          type: string
          enum:
          - business
        required:
          type: object
          description: KYC fields required for this rail. The required fields varies based on the Rail.
          properties:
            businessName:
              type: string
            businessType:
              type: string
            businessIndustry:
              type: string
            registrationNumber:
              type: string
            registeredAddress:
              type: string
            address:
              $ref: '#/components/schemas/AddressReqOptObject'
            website:
              type: string
            incorporationDate:
              type: string
            email:
              type: string
            phone:
              type: string
            taxIdentificationNumber:
              type: string
            sofEuQuestionnaire:
              $ref: '#/components/schemas/SofEuQaKybReqOptObject'
            ultimateBeneficialOwners:
              type: array
            documents:
              $ref: '#/components/schemas/USDRailBusinessDocReqOptObject'
        optional:
          type: object
          description: KYC fields that are optional for this rail. The optional fields varies based on the Rail.
          properties:
            incorporationCountry:
              type: string
            incorporationState:
              type: string
        invalid:
          type: object
          description: KYC fields the user currently holds that are either missing or invalid for this rail. The specific invalid fields vary depending on the user’s current KYC data.
