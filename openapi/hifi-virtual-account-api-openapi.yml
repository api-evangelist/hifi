openapi: 3.2.0
info:
  title: Hifi Virtual Account API
  version: 2.0.0
  description: API documentation for HIFI
servers:
- url: https://production.hifibridge.com
  description: Production server
- url: https://sandbox.hifibridge.com
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Virtual Account
  description: Virtual Account endpoints
paths:
  /v2/users/{userId}/virtual-accounts:
    post:
      summary: Create a virtual account
      description: 'Generate a virtual bank account to onramp from `sourceCurrency` to `destinationCurrency` on chain `destinationChain`. (note: virtual accounts are billable)'
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      requestBody:
        $ref: '#/components/requestBodies/CreateVirtualAccountBody'
      responses:
        '200':
          $ref: '#/components/responses/CreateVirtualAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2UsersByUserIdVirtualAccounts
      x-operation-id-source: derived
    get:
      summary: List all virtual accounts
      description: List all virtual accounts associated with a user under your organization.
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/VASourceCurrencyParameter'
      - $ref: '#/components/parameters/VADestinationCurrencyParameter'
      - $ref: '#/components/parameters/VADestinationChainParameter'
      - $ref: '#/components/parameters/LimitParameter'
      - $ref: '#/components/parameters/CreatedBeforeParameter'
      - $ref: '#/components/parameters/CreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/GetAllVirtualAccountsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2UsersByUserIdVirtualAccounts
      x-operation-id-source: derived
  /v2/users/{userId}/virtual-accounts/{accountId}:
    get:
      summary: Retrieve a virtual account
      description: Get an existing virtual bank account detail.
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/VirtualAccountIdPathParameter'
      - $ref: '#/components/parameters/VALimitParameter'
      - $ref: '#/components/parameters/VACreatedBeforeParameter'
      - $ref: '#/components/parameters/VACreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/GetVirtualAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2UsersByUserIdVirtualAccountsByAccountId
      x-operation-id-source: derived
  /v2/users/{userId}/virtual-accounts/{accountId}/update:
    post:
      summary: Update a virtual account
      description: Update an existing virtual account.
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/VirtualAccountIdPathParameter'
      requestBody:
        $ref: '#/components/requestBodies/UpdateVirtualAccountBody'
      responses:
        '200':
          $ref: '#/components/responses/UpdateVirtualAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2UsersByUserIdVirtualAccountsByAccountIdUpdate
      x-operation-id-source: derived
  /v2/users/{userId}/virtual-accounts/{accountId}/deactivate:
    post:
      summary: Deactivate a virtual account
      description: Deactivate an existing virtual account.
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/VirtualAccountIdPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/DeactivateVirtualAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2UsersByUserIdVirtualAccountsByAccountIdDeactivate
      x-operation-id-source: derived
  /v2/users/{userId}/virtual-accounts/{accountId}/reactivate:
    post:
      summary: Reactivate a virtual account
      description: Reactivate an existing virtual account.
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/VirtualAccountIdPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/ReactivateVirtualAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2UsersByUserIdVirtualAccountsByAccountIdReactivate
      x-operation-id-source: derived
  /v2/users/{userId}/virtual-accounts/{accountId}/simulate-deposit:
    post:
      summary: Simulate a deposit to a virtual account
      description: 'Simulate a deposit to a virtual account in sandbox environment. This endpoint is only available in sandbox and allows testing deposit flows.


        **Note:** This endpoint is only available in sandbox environment.'
      tags:
      - Virtual Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/VirtualAccountIdPathParameter'
      requestBody:
        $ref: '#/components/requestBodies/SimulateVirtualAccountDepositBody'
      responses:
        '200':
          $ref: '#/components/responses/SimulateVirtualAccountDepositResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2UsersByUserIdVirtualAccountsByAccountIdSimulateDeposit
      x-operation-id-source: derived
components:
  schemas:
    CreateVirtualAccount:
      type: object
      title: Create Virtual Account
      description: 'Create a virtual account and optionally configure its automatic USDT

        onramp conversion-fee threshold.

        '
      properties:
        sourceCurrency:
          type: string
          enum:
          - usd
        destinationCurrency:
          type: string
          enum:
          - usdc
          - usdt
          - usdg
          - pyusd
        destinationChain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - BASE
          - TRON
          description: 'Either `externalWalletId` or `destinationChain` must be provided. If provided, the token will be delivered to user''s HIFI wallet on the destination chain.

            '
        externalWalletId:
          type: string
          description: 'Either `externalWalletId` or `destinationChain` must be provided.

            '
        maxBps:
          oneOf:
          - type:
            - integer
            - 'null'
            minimum: 0
            maximum: 10000
          - type: string
            pattern: ^0*(?:[0-9]{1,4}|10000)$
          description: 'Maximum USDT conversion fee, supplied as an integer or decimal-integer

            string representing 0 through 10,000 basis points, allowed for automatic

            onramps through this virtual account. Omit or use `null` to leave the

            threshold disabled.

            '
        transferType:
          type: string
          enum:
          - ach
          - wire
      required:
      - sourceCurrency
      - destinationCurrency
    DeactivateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    VirtualAccountListObject:
      type: object
      properties:
        count:
          type: integer
          description: Number of virtual accounts.
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualAccountObject'
        nextCursor:
          type: string
          description: The `createdAt` timestamp of the last record in the current page. Pass this as `createdBefore` in the next request to retrieve the next page of results.
    UpdateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        virtualAccountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    Unauthorized:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    InboundObject:
      type: object
      properties:
        bankName:
          type:
          - string
          - 'null'
        senderName:
          type:
          - string
          - 'null'
        routingNumber:
          type:
          - string
          - 'null'
        accountNumber:
          type:
          - string
          - 'null'
        accountType:
          type:
          - string
          - 'null'
          description: ACH field. `null` when the inbound payment did not carry it.
        fedBatchId:
          type:
          - string
          - 'null'
          description: ACH field. `null` when the inbound payment did not carry it.
        imad:
          type:
          - string
          - 'null'
          description: Fedwire input message identifier. `null` when the inbound payment did not carry it.
        omad:
          type:
          - string
          - 'null'
          description: Fedwire output message identifier. `null` when the inbound payment did not carry it.
        traceNumber:
          type:
          - string
          - 'null'
          description: Trace number for the inbound payment. `null` when the payment did not carry one.
        bankAddress:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        references:
          type:
          - object
          - 'null'
          description: Remittance and reference information supplied by the sender. `null` when the payment carried none.
          properties:
            senderReference:
              type:
              - string
              - 'null'
            beneficiaryReference:
              type:
              - string
              - 'null'
            remittance:
              type: array
              items:
                type: string
        paymentRail:
          type:
          - string
          - 'null'
          enum:
          - ach
          - wire
          - rtp
    CreateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    InternalServerError:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    OnrampSandboxScenario:
      type: string
      enum:
      - FIAT_FAILED
      - COMPLETED
      description: 'Sandbox-only field that forces the onramp created by this deposit to a predetermined outcome

        '
    UpdateVirtualAccount:
      type: object
      title: Update Virtual Account
      description: 'Update the virtual account''s destination routing, its automatic USDT onramp

        conversion-fee threshold, or both. `maxBps` may be sent by itself.

        '
      properties:
        sourceCurrency:
          type: string
          enum:
          - usd
        destinationCurrency:
          type: string
          enum:
          - usdc
          - usdt
          - usdg
          - pyusd
        destinationChain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - BASE
          - TRON
          description: 'Either `externalWalletId` or `destinationChain` must be provided. If provided, the token will be delivered to user''s HIFI wallet on the destination chain.

            '
        externalWalletId:
          type: string
          description: 'Either `externalWalletId` or `destinationChain` must be provided.

            '
        maxBps:
          oneOf:
          - type:
            - integer
            - 'null'
            minimum: 0
            maximum: 10000
          - type: string
            pattern: ^0*(?:[0-9]{1,4}|10000)$
          description: 'Maximum USDT conversion fee, supplied as an integer or decimal-integer

            string representing 0 through 10,000 basis points, allowed for automatic

            onramps through this virtual account. Omit to preserve the current value;

            use `null` to disable the threshold.

            '
      oneOf:
      - title: Update conversion-fee threshold only
        required:
        - maxBps
        not:
          anyOf:
          - required:
            - sourceCurrency
          - required:
            - destinationCurrency
          - required:
            - destinationChain
          - required:
            - externalWalletId
      - title: Update destination routing
        required:
        - sourceCurrency
        - destinationCurrency
        oneOf:
        - required:
          - destinationChain
        - required:
          - externalWalletId
    VirtualAccountObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        source:
          type: object
          properties:
            paymentRail:
              type: array
              items:
                type: string
            currency:
              type: string
        destination:
          type: object
          properties:
            chain:
              type: string
            currency:
              type: string
            walletAddress:
              type: string
            externalWalletId:
              type: string
        status:
          type: string
          enum:
          - activated
          - deactivated
        maxBps:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 10000
          description: 'Maximum USDT conversion fee, as a whole number of basis points from

            0 through 10,000, allowed for automatic onramps through this virtual

            account. `null` means disabled.

            '
        microDeposits:
          type: object
          properties:
            count:
              type: integer
            data:
              type: array
              items:
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                  currency:
                    type: string
                  amount:
                    type: string
                    description: Amount received, in dollars as a decimal string (for example `"0.71"`). Not cents.
                    example: '0.71'
                  sourceBankInfo:
                    $ref: '#/components/schemas/InboundObject'
        depositInstructions:
          type: object
          properties:
            bankName:
              type: string
            bankAddress:
              type: string
            swiftCode:
              type: string
            beneficiary:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
            ach:
              type: object
              properties:
                routingNumber:
                  type: string
                accountNumber:
                  type: string
            wire:
              type: object
              properties:
                routingNumber:
                  type: string
                accountNumber:
                  type: string
            rtp:
              type: object
              properties:
                routingNumber:
                  type: string
                accountNumber:
                  type: string
            reference:
              type: string
            depositBy:
              type: string
              format: date-time
            instruction:
              type: string
        settlementRuleId:
          type: string
          format: uuid
    SimulateVirtualAccountDeposit:
      type: object
      title: Simulate Virtual Account Deposit
      properties:
        amount:
          type: string
          description: Amount to simulate deposit
        paymentRail:
          type: string
          enum:
          - WIRE
          - ACH
          - RTP
          description: Payment rail for the simulated deposit , recommended to use WIRE for faster settlement
        requestId:
          type: string
          description: Unique identifier for the request (recommend using uuid v4)
        source:
          type: object
          required:
          - routingNumber
          - accountNumber
          - name
          - bankName
          properties:
            routingNumber:
              type: string
              description: Routing number of the source bank account
            accountNumber:
              type: string
              description: Account number of the source bank account
            name:
              type: string
              description: Name on the source bank account
            bankName:
              type: string
              description: Name of the source bank
        userId:
          type: string
          description: Optional user ID to associate with this deposit
        reference:
          type: string
          description: Optional reference for this deposit
        description:
          type: string
          description: Optional description for this deposit
        sandboxScenario:
          $ref: '#/components/schemas/OnrampSandboxScenario'
      required:
      - amount
      - paymentRail
      - requestId
      - source
    ReactivateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
