  parameters:
    VASourceCurrencyParameter:
      name: sourceCurrency
      in: query
      schema:
        type: string
        enum:
        - usd
      description: Source currency
      required: false
    CreatedAfterParameter:
      name: createdAfter
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    VADestinationCurrencyParameter:
      name: destinationCurrency
      in: query
      schema:
        type: string
        enum:
        - usdc
        - usdt
      description: Destination currency
      required: false
    UserIdPathParameter:
      name: userId
      in: path
      schema:
        type: string
      description: ID of the user
      required: true
    CreatedBeforeParameter:
      name: createdBefore
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    VACreatedBeforeParameter:
      name: createdBefore
      in: query
      schema:
        type: string
      description: Return the micro deposit records that created before this eventId
      required: false
    VADestinationChainParameter:
      name: destinationChain
      in: query
      schema:
        type: string
        enum:
        - POLYGON
      description: Destination chain
      required: false
    VirtualAccountIdPathParameter:
      name: accountId
      in: path
      schema:
        type: string
      description: ID of the virtual account
      required: true
    LimitParameter:
      name: limit
      in: query
      schema:
        type: string
        minimum: 1
        maximum: 100
      description: default to 10, maximum to 100
      required: false
    VACreatedAfterParameter:
      name: createdAfter
      in: query
      schema:
        type: string
      description: Return the micro deposit records that created after this eventId
      required: false
    VALimitParameter:
      name: limit
      in: query
      schema:
        type: string
        minimum: 1
        maximum: 100
      description: Number of micro deposit records return for the virtual account, default to 10 maximum to 100
      required: false
  requestBodies:
    UpdateVirtualAccountBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateVirtualAccount'
    CreateVirtualAccountBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateVirtualAccount'
    SimulateVirtualAccountDepositBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulateVirtualAccountDeposit'
  responses:
    SimulateVirtualAccountDepositResponse:
      description: Successfully triggered sandbox deposit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulateVirtualAccountDeposit'
          examples:
