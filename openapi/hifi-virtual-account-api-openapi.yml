              accountNumber: '123456789'
            instruction: Please deposit usd to the bank account provided. Please ensure that the beneficiary name matches the account holder name provided, or the payment may be rejected.
          settlementRuleId: null
  schemas:
    ReactivateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    UpdateVirtualAccount:
      type: object
      title: Update Virtual Account
      properties:
        sourceCurrency:
          type: string
          enum:
          - usd
        destinationCurrency:
          type: string
          enum:
          - usdc
          - usdt
          description: 'usdt is only supported on ethereum

            '
        destinationChain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - BASE
          description: 'Either `externalWalletId` or `destinationChain` must be provided.

            '
        externalWalletId:
          type: string
          description: 'Either `externalWalletId` or `destinationChain` must be provided.

            '
      required:
      - sourceCurrency
      - destinationCurrency
    InternalServerError:
      type: object
      properties:
        error:
          type: string
          example: Unexpected error happened
    CreateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    VirtualAccountListObject:
      type: object
      properties:
        count:
          type: integer
          description: Number of virtual accounts.
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualAccountObject'
        nextCursor:
          type: string
          description: The `createdAt` timestamp of the last record in the current page. Pass this as `createdBefore` in the next request to retrieve the next page of results.
    DeactivateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    VirtualAccountObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        source:
          type: object
          properties:
            paymentRail:
              type: array
              items:
                type: string
            currency:
              type: string
        destination:
          type: object
          properties:
            chain:
              type: string
            currency:
              type: string
            walletAddress:
              type: string
            externalWalletId:
              type: string
        status:
          type: string
          enum:
          - activated
          - deactivated
        microDeposits:
          type: object
          properties:
            count:
              type: integer
            data:
              type: array
              items:
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                  currency:
                    type: string
                  amount:
                    type: integer
                  sourceBankInfo:
                    $ref: '#/components/schemas/InboundObject'
        depositInstructions:
          type: object
          properties:
            bankName:
              type: string
            bankAddress:
              type: string
            swiftCode:
              type: string
            beneficiary:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
            ach:
              type: object
              properties:
                routingNumber:
                  type: string
                accountNumber:
                  type: string
            wire:
              type: object
              properties:
                routingNumber:
                  type: string
                accountNumber:
                  type: string
            rtp:
              type: object
              properties:
                routingNumber:
                  type: string
                accountNumber:
                  type: string
            reference:
              type: string
            depositBy:
              type: string
              format: date-time
            instruction:
              type: string
        settlementRuleId:
          type: string
          format: uuid
    CreateVirtualAccount:
      type: object
      title: Create Virtual Account
      properties:
        sourceCurrency:
          type: string
          enum:
          - usd
        destinationCurrency:
          type: string
          enum:
          - usdc
          - usdt
          description: 'usdt is only supported on ethereum

            '
        destinationChain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - BASE
          description: 'Either `externalWalletId` or `destinationChain` must be provided.

            '
        externalWalletId:
          type: string
          description: 'Either `externalWalletId` or `destinationChain` must be provided.

            '
      required:
      - sourceCurrency
      - destinationCurrency
    InboundObject:
      type: object
      properties:
        bankName:
          type: string
        senderName:
          type: string
        routingNumber:
          type: string
        accountNumber:
          type: string
        accountType:
          type: string
        fedBatchId:
          type: string
        imad:
          type: string
        omad:
          type: string
        traceNumber:
          type: string
        bankAddress:
          type: string
        description:
          type: string
        paymentRail:
          type: string
          enum:
          - ach
          - wire
          - rtp
    UpdateVirtualAccountObject:
      type: object
      properties:
        message:
          type: string
        accountInfo:
          $ref: '#/components/schemas/VirtualAccountObject'
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          example: Not authorized
    SimulateVirtualAccountDeposit:
      type: object
      title: Simulate Virtual Account Deposit
      properties:
        amount:
          type: string
          description: Amount to simulate deposit
        paymentRail:
          type: string
          enum:
          - WIRE
          - ACH
          description: Payment rail for the simulated deposit , recommended to use WIRE for faster settlement
        requestId:
          type: string
          description: Unique identifier for the request (recommend using uuid v4)
        source:
          type: object
          required:
          - routingNumber
          - accountNumber
          - name
          - bankName
          properties:
            routingNumber:
              type: string
              description: Routing number of the source bank account
            accountNumber:
              type: string
              description: Account number of the source bank account
            name:
              type: string
              description: Name on the source bank account
            bankName:
              type: string
              description: Name of the source bank
        userId:
          type: string
          description: Optional user ID to associate with this deposit
        reference:
          type: string
          description: Optional reference for this deposit
        description:
          type: string
          description: Optional description for this deposit
      required:
      - amount
      - paymentRail
      - requestId
      - source
  parameters:
    LimitParameter:
      name: limit
      in: query
      schema:
        type: string
        minimum: 1
        maximum: 100
      description: default to 10, maximum to 100
      required: false
    VASourceCurrencyParameter:
      name: sourceCurrency
      in: query
      schema:
        type: string
        enum:
        - usd
      description: Source currency
      required: false
    VADestinationCurrencyParameter:
      name: destinationCurrency
      in: query
      schema:
        type: string
        enum:
        - usdc
        - usdt
      description: Destination currency
      required: false
    VACreatedBeforeParameter:
      name: createdBefore
      in: query
      schema:
        type: string
      description: Return the micro deposit records that created before this eventId
      required: false
    CreatedBeforeParameter:
      name: createdBefore
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    UserIdPathParameter:
      name: userId
      in: path
      schema:
        type: string
      description: ID of the user
      required: true
    VACreatedAfterParameter:
      name: createdAfter
      in: query
      schema:
        type: string
      description: Return the micro deposit records that created after this eventId
      required: false
    VirtualAccountIdPathParameter:
      name: accountId
      in: path
      schema:
        type: string
      description: ID of the virtual account
      required: true
    CreatedAfterParameter:
      name: createdAfter
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    VADestinationChainParameter:
      name: destinationChain
      in: query
      schema:
        type: string
        enum:
        - POLYGON
      description: Destination chain
      required: false
    VALimitParameter:
      name: limit
      in: query
      schema:
        type: string
        minimum: 1
        maximum: 100
      description: Number of micro deposit records return for the virtual account, default to 10 maximum to 100
      required: false
  requestBodies:
    UpdateVirtualAccountBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateVirtualAccount'
    CreateVirtualAccountBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateVirtualAccount'
    SimulateVirtualAccountDepositBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulateVirtualAccountDeposit'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
