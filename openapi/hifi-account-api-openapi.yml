    IndiaGlobalNetworkAccount:
      type: object
      title: India Global Network Account
      description: "Required fields depend on `currency`:\n- `inr`: the required bank fields depend on `transferType` — `account_ifsc` needs\n  `accountNumber` + `ifsc`; `imps_p2p` needs `beneficiaryPhone` + `mmid`.\n- `usd`: requires `bankName`, `accountNumber`, `swiftCode`.\n\nSubmitting a field set that does not match `currency`/`transferType` returns a field\nvalidation error.\n"
      properties:
        currency:
          type: string
          enum:
          - inr
          - usd
          description: The currency for the account.
        transferType:
          type: string
          enum:
          - account_ifsc
          - imps_p2p
          - swift
          description: 'For `currency: inr`: `account_ifsc` pays to a bank account number + IFSC code, `imps_p2p`

            pays to a mobile number + MMID via IMPS. For `currency: usd`: `swift` (default) pays via

            SWIFT wire.

            '
        accountNumber:
          type: string
          description: 'Beneficiary bank account number. Required for `account_ifsc` (inr) and for `usd`.

            '
        ifsc:
          type: string
          description: 'IFSC code of the beneficiary bank branch — 4 letters, then `0`, then 6 alphanumeric

            characters (e.g. `HDFC0001234`). Required for `account_ifsc` (inr).

            '
        beneficiaryPhone:
          type: string
          description: 'Beneficiary Indian mobile number — 10 digits starting with 6-9 (no country code).

            Required for `imps_p2p` (inr).

            '
        mmid:
          type: string
          description: 'Beneficiary Mobile Money Identifier — 7 digits, issued by the beneficiary''s bank.

            Required for `imps_p2p` (inr).

            '
        bankName:
          type: string
          description: Bank name for the account. Required for `usd`.
        swiftCode:
          type: string
          description: SWIFT/BIC code. Required for `usd`.
      required:
      - currency
      - transferType
