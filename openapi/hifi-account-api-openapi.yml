    CanadaGlobalNetworkAccount:
      type: object
      title: Canada Global Network Account
      description: 'Required fields: `currency`, `bankName`, `accountNumber`, `swiftCode`.

        - `swift` (default): `currency` must be `usd`.

        - `bank` (local transfer within Canada): `currency` must be `cad`, `bankCode` and `transitNumber` are also required.

        '
      properties:
        transferType:
          type: string
          enum:
          - swift
          - bank
          description: Transfer type of the account. `swift` is the default transfer type if not provided.
        currency:
          type: string
          enum:
          - usd
          - cad
          description: The currency for the account. `usd` for SWIFT, `cad` for local transfer.
        bankName:
          type: string
          description: Bank name for the account
        accountNumber:
          type: string
          description: Bank account number
        swiftCode:
          type: string
          description: SWIFT/BIC code
        bankCode:
          type: string
          pattern: ^\d{3}$
          description: Institution number. Exactly 3 digits. Required for `bank` (local) transfers.
        transitNumber:
          type: string
          pattern: ^\d{5}$
          description: Transit number. Exactly 5 digits. Required for `bank` (local) transfers.
      required:
      - currency
      - transferType
      - bankName
      - accountNumber
      - swiftCode
