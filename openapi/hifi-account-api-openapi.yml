    HongKongGlobalNetworkAccount:
      type: object
      title: Hong Kong Global Network Account
      description: 'For transferType `swift`, bankName, accountNumber, and swiftCode are required.

        For transferType `chats`, bankCode, accountNumber, swiftCode, and bankName are required.

        For transferType `fps`, at least one of fpsId, accountNumber, or accountHolder email/phone is required.

        USD CHATS (currency `usd` with transferType `chats`) is only available to business account holders.

        '
      properties:
        bankName:
          type: string
          description: Bank name for the account
        accountNumber:
          type: string
          description: Bank account number
        swiftCode:
          type: string
          description: BIC/SWIFT code for the bank
        currency:
          type: string
          enum:
          - hkd
          - usd
          description: The currency for the account
        bankCode:
          type: string
          description: 'Bank code. Required when transferType is chats.

            Must be either an IFSC code (4 letters + "0" + 6 alphanumeric characters) or a Hong Kong bank code (3 digits).

            '
        fpsId:
          type: string
          description: FPS (Faster Payment System) identifier. Used when transferType is fps; for fps at least one of fpsId, accountNumber, or accountHolder email/phone is required.
        transferType:
          type: string
          enum:
          - chats
          - fps
          - swift
          description: Transfer type of the account. `swift` is the default transfer type if not provided.
