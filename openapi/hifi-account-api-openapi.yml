    UnitedKingdomGlobalNetworkAccount:
      type: object
      title: United Kingdom Global Network Account
      description: 'Required fields depend on transfer type.

        - `swift` (default): `currency` must be `usd`, `iban` and `swiftCode` are required.

        - `sepa`: `currency` must be `eur`, `iban` and `swiftCode` are required.

        - `bank` (local transfer within the United Kingdom): `currency` must be `gbp`, `accountNumber` and `sortCode` are required.

        '
      properties:
        transferType:
          type: string
          enum:
          - swift
          - sepa
          - bank
          description: Transfer type of the account. `swift` is the default transfer type if not provided.
        currency:
          type: string
          enum:
          - usd
          - eur
          - gbp
          description: The currency for the account. `usd` for SWIFT, `eur` for SEPA, `gbp` for local transfer.
        bankName:
          type: string
          description: Bank name for the account.
        iban:
          type: string
          description: IBAN number. Required for `swift` and `sepa` transfers.
        swiftCode:
          type: string
          description: SWIFT/BIC code. Required for `swift` and `sepa` transfers.
        accountNumber:
          type: string
          description: Account number. Required for `bank` (local) transfers.
        sortCode:
          type: string
          pattern: ^\d{6}$
          description: UK sort code. Exactly 6 digits, no separators. Required for `bank` (local) transfers.
      required:
      - currency
      - transferType
      - bankName
