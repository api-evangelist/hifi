    AustraliaGlobalNetworkAccount:
      type: object
      title: Australia Global Network Account
      description: 'Required fields: `currency`, `bankName`, `accountNumber`, plus `swiftCode` or `bsbCode` depending on transfer type.

        - `swift` (default): `currency` must be `usd`, `swiftCode` is required.

        - `bank` (local transfer within Australia): `currency` must be `aud`, `bsbCode` is required.

        '
      properties:
        transferType:
          type: string
          enum:
          - swift
          - bank
          description: Transfer type of the account. `swift` is the default transfer type if not provided.
        currency:
          type: string
          enum:
          - usd
          - aud
          description: The currency for the account. `usd` for SWIFT, `aud` for local transfer.
        bankName:
          type: string
          description: Bank name for the account
        accountNumber:
          type: string
          description: Account number
        swiftCode:
          type: string
          description: Bank code. Required for `swift` transfers.
        bsbCode:
          type: string
          pattern: ^\d{6}$
          description: Bank State Branch (BSB) code. Exactly 6 digits, no separators. Required for `bank` (local) transfers.
      required:
      - currency
