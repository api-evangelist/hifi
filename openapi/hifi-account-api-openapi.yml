openapi: 3.2.0
info:
  title: Hifi Account API
  version: 2.0.0
  description: API documentation for HIFI
servers:
- url: https://production.hifibridge.com
  description: Production server
- url: https://sandbox.hifibridge.com
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Account
  description: Account endpoints
paths:
  /v2/users/{userId}/accounts:
    post:
      summary: Create an account
      description: Create an onramp or offramp account for different account types by providing your bank account information.
      tags:
      - Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      requestBody:
        $ref: '#/components/requestBodies/CreateAccountBody'
      responses:
        '200':
          $ref: '#/components/responses/CreateAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2UsersByUserIdAccounts
      x-operation-id-source: derived
    get:
      summary: List all accounts
      description: List all accounts associated with a user under your organization.
      tags:
      - Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/AccountRailOptionalParameter'
      - $ref: '#/components/parameters/AccountTypeOptionalParameter'
      - $ref: '#/components/parameters/CurrencyAnyOptionalParameter'
      - $ref: '#/components/parameters/LimitParameter'
      - $ref: '#/components/parameters/CreatedBeforeParameter'
      - $ref: '#/components/parameters/CreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/GetAllAccountsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2UsersByUserIdAccounts
      x-operation-id-source: derived
  /v2/users/{userId}/accounts/{accountId}:
    get:
      summary: Retrieve an account
      description: Get an existing onramp or offramp account detail.
      tags:
      - Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/AccountIdPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/GetAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2UsersByUserIdAccountsByAccountId
      x-operation-id-source: derived
    delete:
      summary: Delete an account
      description: Delete an existing onramp or offramp account.
      tags:
      - Account
      parameters:
      - $ref: '#/components/parameters/UserIdPathParameter'
      - $ref: '#/components/parameters/AccountIdPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/DeleteAccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: deleteV2UsersByUserIdAccountsByAccountId
      x-operation-id-source: derived
components:
  schemas:
    PeruGlobalNetworkAccount:
      type: object
      title: Peru Global Network Account
      properties:
        transferType:
          type: string
          enum:
          - swift
          description: Transfer type of the account. `swift` is the default transfer type if not provided.
        currency:
          type: string
          enum:
          - usd
          description: The currency for the account
        bankName:
          type: string
          description: Bank name for the account
        accountNumber:
          type: string
          description: Account number
        swiftCode:
          type: string
          description: Bank code
      required:
      - currency
      - transferType
      - bankName
      - accountNumber
      - swiftCode
    ColombiaGlobalNetworkBusinessAccountHolder:
      type: object
      description: Account holder information. For `bank` transfer type, `idNumber` and `phone` are also required.
      properties:
        name:
          type: string
          description: Business name
        type:
          type: string
          enum:
          - business
        address:
          type: object
          properties:
            city:
              type: string
            country:
              type: string
            postalCode:
              type: string
            addressLine1:
              type: string
            addressLine2:
              type: string
            stateProvinceRegion:
              type: string
          required:
          - city
          - country
          - postalCode
          - addressLine1
          - stateProvinceRegion
        formationDate:
          type: string
          format: date
          description: Formation date in YYYY-MM-DD format
        idNumber:
          type: string
          description: Government issued ID number. Required for `bank` transfer type.
        isFintech:
          type: boolean
          description: Whether the business account is a fintech.
        phone:
          type: string
          description: Phone number in E164 format. Required for `bank` transfer type.
        email:
          type: string
          format: email
          description: Email address of the business.
      required:
      - name
      - type
      - address
