openapi: 3.2.0
info:
  title: Hifi Token Swap API
  version: 2.0.0
  description: API documentation for HIFI
servers:
- url: https://production.hifibridge.com
  description: Production server
- url: https://sandbox.hifibridge.com
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Token Swap
  description: Token Swap endpoints
paths:
  /v2/wallets/swaps:
    post:
      summary: Create a swap
      description: Create a swap request to exchange one cryptocurrency for another within the same chain or across chains.
      tags:
      - Token Swap
      requestBody:
        $ref: '#/components/requestBodies/CreateWalletSwapBody'
      responses:
        '200':
          $ref: '#/components/responses/WalletSwapResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2WalletsSwaps
      x-operation-id-source: derived
    get:
      summary: List all swaps
      description: Returns a list of swaps associated with a user under your organization. The swaps are returned sorted by creation date, with the most recent swaps appearing first.
      tags:
      - Token Swap
      parameters:
      - $ref: '#/components/parameters/UserIdOptionalParameter'
      - $ref: '#/components/parameters/LimitParameter'
      - $ref: '#/components/parameters/CreatedBeforeParameter'
      - $ref: '#/components/parameters/CreatedAfterParameter'
      responses:
        '200':
          $ref: '#/components/responses/WalletSwapAllRecordsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2WalletsSwaps
      x-operation-id-source: derived
  /v2/wallets/swaps/rate:
    get:
      summary: Retrieve a swap rate
      description: Get the current market rate for swapping an amount of sourceCurrency into destinationCurrency. Currently only supported between usdc and usdt.
      tags:
      - Token Swap
      parameters:
      - $ref: '#/components/parameters/SwapRateSourceCurrencyParameter'
      - $ref: '#/components/parameters/SwapRateDestinationCurrencyParameter'
      - $ref: '#/components/parameters/SwapRateAmountParameter'
      responses:
        '200':
          $ref: '#/components/responses/WalletSwapRateResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2WalletsSwapsRate
      x-operation-id-source: derived
  /v2/wallets/swaps/{swapId}:
    get:
      summary: Retrieve a swap
      description: Retrieve details of a specific swap by its ID.
      tags:
      - Token Swap
      parameters:
      - $ref: '#/components/parameters/SwapTransferIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/WalletSwapResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: getV2WalletsSwapsBySwapId
      x-operation-id-source: derived
  /v2/wallets/swaps/{swapId}/accept:
    post:
      summary: Accept a swap
      description: Accept a swap request to execute the cryptocurrency exchange.
      tags:
      - Token Swap
      parameters:
      - $ref: '#/components/parameters/SwapTransferIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/WalletSwapResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2WalletsSwapsBySwapIdAccept
      x-operation-id-source: derived
  /v2/wallets/swaps/{swapId}/cancel:
    post:
      summary: Request swap cancellation
      description: 'Request cancellation of a swap while it is still cancellable. A successful

        response confirms that the cancellation request was recorded; it does not

        guarantee that the swap has already reached the terminal `CANCELLED` status.'
      tags:
      - Token Swap
      parameters:
      - $ref: '#/components/parameters/SwapTransferIDPathParameter'
      responses:
        '200':
          $ref: '#/components/responses/WalletSwapResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      operationId: postV2WalletsSwapsBySwapIdCancel
      x-operation-id-source: derived
components:
  schemas:
    WalletSwapAmountObject:
      type: object
      properties:
        amount:
          type: string
          example: '10'
        currency:
          type: string
          example: usdc
    CreateWalletSwap:
      type: object
      required:
      - requestId
      - source
      - destination
      properties:
        requestId:
          type: string
          format: uuid
          description: Unique identifier for the swap request (recommend using uuid v4)
          example: 1ab3e6e0-4839-4dbe-89c3-b06d9645ae86
        limitPrice:
          type: string
          pattern: ^(?=.*[1-9])\d+(?:\.\d{1,4})?$
          description: 'Optional positive limit price, expressed as destination-currency units

            per one source-currency unit. Supported only for direct USDT/USDC swaps

            in either direction and limited to four decimal places. Omit to use

            market pricing.

            '
          example: '0.9990'
        cancelAfterSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: 'Optional number of seconds after creating the swap when execution should

            be cancelled if it has not already started. Supported only for direct

            USDT/USDC swaps in either direction. Omit to disable automatic cancellation.

            '
          example: 3600
        source:
          type: object
          description: Source wallet information for the swap
          required:
          - userId
          - chain
          - currency
          properties:
            userId:
              type: string
              format: uuid
              description: User ID of the source wallet owner
              example: 05179f69-1988-4b46-a847-dd4eea0984d6
            chain:
              type: string
              enum:
              - POLYGON
              - ETHEREUM
              - SOLANA
              - TRON
              description: Blockchain network for the source wallet
              example: POLYGON
            currency:
              type: string
              enum:
              - usdc
              - usdt
              description: Source cryptocurrency to swap from
              example: usdt
            amount:
              type: string
              description: Amount to swap (either source.amount or destination.amount must be provided)
              example: '10000'
        destination:
          type: object
          description: Destination wallet information for the swap
          required:
          - chain
          - currency
          properties:
            userId:
              type: string
              format: uuid
              description: User ID of the destination wallet owner
              example: 05179f69-1988-4b46-a847-dd4eea0984d6
            externalWalletId:
              type: string
              format: uuid
              description: External wallet ID (Exclude with userId)
              example: 64fc4e9d-4839-4384-b4a0-0376af2c9b2e
            walletAddress:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
              description: Wallet address (Exclude with userId)
              example: '0xE9cfBf1D690565579D823264170eE357f80e9A34'
            chain:
              type: string
              enum:
              - POLYGON
              - ETHEREUM
              - SOLANA
              - TRON
              description: Blockchain network for the destination wallet
              example: POLYGON
            currency:
              type: string
              enum:
              - usdc
              - usdt
              - usdg
              description: Destination cryptocurrency to swap to
              example: usdc
            amount:
              type: string
              description: Amount to receive (either source.amount or destination.amount must be provided)
              example: '10000'
    WalletSwapDestinationObject:
      type: object
      properties:
        currency:
          type: string
          enum:
          - usdc
          - usdt
          - usdg
          - pyusd
          - pyusd0
          example: usdt
        userId:
          type: string
          format: uuid
          example: 05179f69-1988-4b46-a847-dd4eea0984d6
        externalWalletId:
          type:
          - string
          - 'null'
          format: uuid
          example: null
        amount:
          type:
          - number
          - 'null'
          example: null
        chain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - FLOW_EVM
          example: POLYGON
        walletAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          example: '0xe5727a4B1d93A26D6A7Adfaae145EFa41ED7f204'
    WalletSwapSourceObject:
      type: object
      properties:
        currency:
          type: string
          enum:
          - usdc
          - usdt
          - usdg
          - pyusd
          - pyusd0
          example: usdc
        amount:
          type: number
          example: 10
        chain:
          type: string
          enum:
          - POLYGON
          - ETHEREUM
          - SOLANA
          - FLOW_EVM
        userId:
          type: string
          format: uuid
          example: 05179f69-1988-4b46-a847-dd4eea0984d6
    WalletSwapRateObject:
      type: object
      properties:
        sourceCurrency:
          type: string
          example: usdc
        destinationCurrency:
          type: string
          example: usdt
        sourceAmount:
          type: string
          example: '100.00'
        destinationAmount:
          type: string
          example: '99.98'
        conversionRate:
          type: string
          example: '0.99980'
      example:
        sourceCurrency: usdc
        destinationCurrency: usdt
        sourceAmount: '100.00'
        destinationAmount: '99.98'
        conversionRate: '0.99980'
    WalletSwapAllRecordsObject:
      type: object
      properties:
        count:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletSwapObject'
        nextCursor:
          type: string
          format: date-time
          example: '2025-08-20T04:08:10.837+00:00'
    WalletSwapObject:
      type: object
      properties:
        transferType:
          type: string
          example: WALLET.SWAP
        transferDetails:
          $ref: '#/components/schemas/WalletSwapDetailsObject'
    Unauthorized:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    InternalServerError:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        error:
          type: string
          description: Error type
        errorDetails:
          type: string
          description: Detailed error message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          example: Invalid API key or user not found
    WalletSwapDetailsObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: dc923cc1-d74b-58f6-9fe4-9e9c6eb8dc37
        requestId:
          type: string
          format: uuid
          example: 1ab3e6e0-4839-4dbe-89c3-b06d9645ae86
        status:
          type: string
          enum:
          - OPEN_QUOTE
          - CREATED
          - PENDING
          - COMPLETED
          - QUOTE_FAILED
          - FAILED
          - CANCELLED
          example: COMPLETED
        createdAt:
          type: string
          format: date-time
          example: '2025-08-20T03:55:29.437108+00:00'
        updatedAt:
          type: string
          format: date-time
          example: '2025-08-20T04:08:10.837+00:00'
        source:
          $ref: '#/components/schemas/WalletSwapSourceObject'
        destination:
          $ref: '#/components/schemas/WalletSwapDestinationObject'
        error:
          type:
          - string
          - 'null'
          example: null
        errorDetails:
          type:
          - string
          - 'null'
          example: null
        cancellable:
          type: boolean
          description: 'Whether a new manual cancellation request can be submitted for this swap.

            `false` after cancellation has been requested, execution has passed the

            cancellation point of no return, or the swap is in a terminal status.

            '
          example: true
        autoCancelAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Absolute automatic-cancellation deadline requested when the swap was

            created. `null` when no automatic deadline was requested. The deadline

            is actionable only while `cancellable` is `true`.

            '
          example: '2026-07-13T02:00:00.000Z'
        cancelRequestedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Server timestamp for the accepted manual cancellation request. `null`

            until a manual cancellation request has been recorded.

            '
          example: null
        quoteInformation:
          $ref: '#/components/schemas/WalletSwapQuoteInformationObject'
    WalletSwapQuoteInformationObject:
      type: object
      properties:
        sendGross:
          $ref: '#/components/schemas/WalletSwapAmountObject'
        sendNet:
          $ref: '#/components/schemas/WalletSwapAmountObject'
        receiveGross:
          $ref: '#/components/schemas/WalletSwapAmountObject'
        receiveNet:
          $ref: '#/components/schemas/WalletSwapAmountObject'
        rate:
          type: string
          example: '1'
        limitPrice:
          type: string
          pattern: ^(?=.*[1-9])\d+(?:\.\d{1,4})?$
          description: 'The accepted client limit price, expressed as destination-currency

            units per one source-currency unit. Present only when the swap request

            included `limitPrice`.

            '
          example: '0.9990'
        expiresAt:
          type: string
          format: date-time
          example: '2025-08-20T03:55:59.539+00:00'
  parameters:
    CreatedAfterParameter:
      name: createdAfter
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    SwapRateSourceCurrencyParameter:
      name: sourceCurrency
      in: query
      schema:
        type: string
        enum:
        - usdc
        - usdt
      description: Currency being swapped from.
      required: true
    SwapRateAmountParameter:
      name: amount
      in: query
      schema:
        type: string
      description: Amount of sourceCurrency to swap.
      required: true
    CreatedBeforeParameter:
      name: createdBefore
      in: query
      schema:
        type: string
        format: date
      description: 'ISO format: YYYY-MM-DD'
      required: false
    UserIdOptionalParameter:
      name: userId
      in: query
      schema:
        type: string
      description: The user ID.
      required: false
    LimitParameter:
      name: limit
      in: query
      schema:
        type: string
        minimum: 1
        maximum: 100
      description: default to 10, maximum to 100
      required: false
    SwapRateDestinationCurrencyParameter:
      name: destinationCurrency
      in: query
      schema:
        type: string
        enum:
        - usdc
        - usdt
      description: Currency being swapped to.
      required: true
    SwapTransferIDPathParameter:
      name: swapId
      in: path
      schema:
        type: string
      description: Swap transfer record ID.
      required: true
  requestBodies:
    CreateWalletSwapBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateWalletSwap'
  responses:
    ConflictResponse:
      description: Conflict — the request collides with the current state of the resource (e.g. idempotency-key reuse with a different payload).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    WalletSwapRateResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WalletSwapRateObject'
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                - error
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
    BadRequestResponse:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                - error
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
                    description: Field-specific validation errors
    WalletSwapResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WalletSwapObject'
    UnauthorizedResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    WalletSwapAllRecordsResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WalletSwapAllRecordsObject'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
